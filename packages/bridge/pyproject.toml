[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "muse-coordination-bridge"
version = "0.1.0"
description = "Python bridge for Muse Coordination Hub"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
muse-bridge-py = "muse_bridge.cli:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
