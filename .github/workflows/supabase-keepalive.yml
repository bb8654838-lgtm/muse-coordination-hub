name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Ping Supabase REST API
        shell: bash
        run: |
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_ANON_KEY" ]]; then
            echo "Supabase keep-alive secrets are not configured; skipping."
            exit 0
          fi

          curl -sf "$SUPABASE_URL/rest/v1/workspaces?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -o /dev/null
